<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'logo/favicon-16x16.png' %}">
    <title>Spare Parts</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .cars-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-left: 40px;
        }

        .car-card {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .car-card img {
            width: 100%;
            height: 150px;   /* fixed height */
            object-fit: cover;  /* keeps image centered + crops excess */
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .car-card h3 {
            flex-grow: 1;
        }
            
        .car-card-link {
            text-decoration: none;
            color: black;
        }
    </style>
    <style>
        @media screen and (max-width: 1024px) {
            .cars-container {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                padding: 0 10px;
            }
        }

        @media screen and (max-width: 768px) {
            .cars-container {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                margin-left: 5px;
            }
        }

        @media screen and (max-width: 480px) {
            .cars-container {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 8px;
                padding: 0 12px;  
            }

            .car-card img {
                height: 130px;
            }
            
            .car-card h3 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    {% include "_partialViews/_topNavBar.html" %}

    <h1 style="margin-left: 50px;">Spare Parts</h1>
    <div class="cars-container">
        {% for parts in spareParts %}
            <a href="{% url 'spare_part_detail' parts.spare_part_id %}" class="car-card-link">
                <div class="car-card">
                    {% if parts.image %}
                        <img src="{{ parts.image.url }}" alt="{{ parts.spare_part_title }}" width="200">
                    {% else %}
                        <p>No image available</p>
                    {% endif %}
                    <h3>{{ parts.spare_part_title }}</h3>
                </div>
            </a>
        {% endfor %}
    </div>

    {% include "_partialViews/_footer.html" %}
</body>
</html>
