<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'logo/favicon-16x16.png' %}">
    <title>Used Cars</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .cars-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 10px 40px;
        }


        .car-card {
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 10px;
            padding: 10px;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .car-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .car-card h3 {
            margin: 0;
        }
            
        .car-card-link {
            text-decoration: none;
            color: black;
        }
    </style>
    <style>
        @media screen and (max-width: 1024px) {
            .cars-container {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                margin: 10px 20px;
            }
        }

        @media screen and (max-width: 768px) {
            .cars-container {
                grid-template-columns: repeat(2, 1fr);
                margin-left: 10px;
            }
        }

        @media screen and (max-width: 480px) {
            .cars-container {
                grid-template-columns: 1fr;   /* one card per row */
                gap: 12px;
                margin: 10px 0;            /* space on both sides */
                padding: 0 16px;
                width: 90%;
            }
            
            .car-card {
                width: 90%;
                margin: 0 auto; 
            }
            
            .car-card img {
                width: 100%;
                height: 160px;
                object-fit: cover;
            }
            
            .car-card h3 {
                font-size: 14px;
                flex-grow: 1;
            }
        }
    </style>
</head>
<body>
    {% include "_partialViews/_topNavBar.html" %}

    <h1 style="margin-left: 50px;">Used Cars</h1>
    <div class="cars-container">
        {% for car in cars %}
            <a href="{% url 'used_car_detail' car.used_cars_id %}" class="car-card-link">
                <div class="car-card">
                    {% if car.mainImage %}
                        <img src="{{ car.mainImage.url }}" alt="{{ car.used_car_title }}" width="200">
                    {% else %}
                        <p>No image available</p>
                    {% endif %}
                    <h3>{{ car.used_car_title }}</h3>
                </div>
            </a>            
        {% endfor %}
    </div>
    {% include "_partialViews/_footer.html" %}
</body>
</html>
